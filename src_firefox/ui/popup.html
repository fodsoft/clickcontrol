<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="./popup.css">
        <title>ClickControl&trade;</title>
        <link rel="icon" type="image/png" href="../img/icon.png">
    </head>

    <body>
        <div class="popup">
            <img src="../img/clickcontrol_logo_b.avif" 
                alt="ClickControl logo" 
                class="logo" 
                draggable="false" 
                onerror="this.style.display='none'">

            <h1 data-lang="msg_warning"></h1>
            <p data-lang="msg_target"></p>

            <div class="url-box" id="target-url" data-lang="msg_loading"></div>

            <div class="btn-group">
                <button id="btn-deny" class="btn deny" data-lang="btn_deny"></button>
                <button id="btn-allow" class="btn allow" data-lang="btn_allow"></button>
            </div>
        </div>

        <script type="module" src="popup.js"></script>
    </body>
</html>
