<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="./menu.css">
        <title>ClickControl&trade;</title>
    </head>

    <body>
        <div class="header">
            <img src="../img/clickcontrol_logo_a.avif" 
                alt="ClickControl logo" 
                class="logo" 
                draggable="false" 
                onerror="this.style.display='none'">
        </div>

        <div class="sec-panel">
            <div class="option">
                <span data-lang="option_enableProtect"></span>
                <label class="switch">
                    <input type="checkbox" id="tog-enable">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="option">
                <div>
                    <span data-lang="option_maxProtect"></span>
                    <small data-lang="desc_maxProtect"></small>
                </div>
                <label class="switch">
                    <input type="checkbox" id="tog-max">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <div class="sec-panel">
            <div class="option">
                <div>
                    <span data-lang="option_allSites"></span>
                    <small data-lang="desc_allSites"></small>
                </div>
                <label class="switch">
                    <input type="checkbox" id="tog-all">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="option" style="align-items: start;">
                <div>
                    <span data-lang="option_customList"></span>
                    <small data-lang="desc_customList"></small>
                </div>
            </div>

            <div class="input-group">
                <input type="text" id="inp-site" 
                    data-lang-placeholder="txt_writeSite">
                <button id="btn-add" data-lang="btn_addSite"></button>
            </div>

            <button id="btn-add-current" style="display: none;"></button>

            <ul id="site-list"></ul>
        </div>

        <div class="footer">
            <a href="https://fodsoft.com/" target="_blank" 
                rel="noopener noreferrer" id="fodsoft-link">
                    <img src="../img/fodsoft_logo.avif" 
                        alt="FODSOFT logo"
                        class="logo-fodsoft" 
                        draggable="false" 
                        onerror="this.style.display='none'">
            </a>
            <p>&copy; 2026 FODSOFT&trade;. Néo Foderé de Frutos. All rights reserved.</p>
        </div>

        <script type="module" src="./menu.js"></script>
    </body>
</html>
